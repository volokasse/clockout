# API NestJS : un Deployment à une instance et son Service interne.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: clockout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: clockout-api:1.0
          # L'image est chargée dans Minikube à la main (étape 10.2) : elle n'existe sur
          # aucun registre. IfNotPresent = "utilise l'image locale, ne va pas la télécharger".
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: API_PORT
              valueFrom:
                configMapKeyRef:
                  name: clockout-config
                  key: API_PORT
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: clockout-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: clockout-config
                  key: DB_PORT
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: clockout-config
                  key: POSTGRES_USER
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: clockout-config
                  key: POSTGRES_DB
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clockout-db
                  key: POSTGRES_PASSWORD
          # Le Service n'envoie du trafic qu'aux Pods "prêts" : l'API répond à /api/health.
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: clockout
spec:
  selector:
    app: api
  ports:
    - port: 3000
      targetPort: 3000
