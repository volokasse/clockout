server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression des fichiers texte (le HTML est compressé d'office).
    gzip on;
    gzip_types text/css application/javascript application/json;

    # API : tout /api/... part vers NestJS. "api" est le nom du service Compose
    # et 3000 son port interne : le navigateur ne les voit jamais, il parle
    # uniquement à ce serveur Nginx.
    # "^~" empêche les règles de cache ci-dessous (regex) de s'appliquer à /api/.
    #
    # Par défaut, Nginx résout le nom "api" une seule fois, au démarrage. Si le
    # conteneur api n'existe pas encore : "host not found in upstream" ; s'il est
    # recréé avec une autre IP : 502 jusqu'au redémarrage de Nginx. Ranger
    # l'adresse dans une variable et déclarer le DNS interne de Docker (127.0.0.11)
    # force Nginx à la redemander (au plus toutes les 10 s) : plus de piège.
    resolver 127.0.0.11 valid=10s;
    location ^~ /api/ {
        set $api http://api:3000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers générés par Angular (main-ABC123.js...) : le nom change quand le
    # contenu change, donc le navigateur peut les garder un an sans les redemander.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html garde toujours le même nom : le navigateur doit le revalider
    # à chaque visite pour découvrir les nouveaux fichiers hachés après un déploiement.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Routes Angular (/today, /history...) : ces chemins n'existent pas sur le disque.
    # Si ce n'est ni un fichier ni un dossier, on renvoie index.html et c'est
    # le routeur d'Angular qui affiche la bonne page (sans ça : 404 au rechargement).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
